name: Scrape Jobs & Auto Deploy

on:
  schedule:
    # Runs twice a day at 06:00 AM & 06:00 PM IST (00:30 & 12:30 UTC)
    - cron: '30 0,12 * * *'
  workflow_dispatch: # Allows manual 1-click trigger from mobile app or GitHub web

permissions:
  contents: write

jobs:
  scrape-and-deploy:
    name: Run Scraper & Update Site
    runs-on: ubuntu-latest
    timeout-minutes: 30

    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Run Scraper & Sitemap Generator
        run: |
          node scripts/scrape.js
          node scripts/generate-sitemap.js

      - name: Check for Changes & Commit
        run: |
          git config --global user.name "github-actions[bot]"
          git config --global user.email "github-actions[bot]@users.noreply.github.com"

          # Stage modified and generated job files
          git add public/scraped-jobs.json scraped-jobs.json public/sitemap.xml

          # Check if there are any staged changes
          if git diff --staged --quiet; then
            echo "No new jobs or sitemap changes found. Skipping commit."
          else
            echo "New updates detected. Committing and pushing to main..."
            git commit -m "chore: auto-update scraped jobs and sitemap [skip ci]"
            git push origin main
          fi

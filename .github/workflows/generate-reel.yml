name: Generate Instagram Reel

on:
  workflow_dispatch:
    inputs:
      job_name:
        description: 'Name of the job to generate Reel for (e.g. IBPS Clerk)'
        required: true
        default: 'Latest'

jobs:
  generate:
    runs-on: ubuntu-latest
    
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: 'npm'

      - name: Install Dependencies
        run: npm ci

      - name: Generate Reel and Send to Telegram
        run: node scripts/instagram/generate-reel.js "${{ github.event.inputs.job_name }}"
        env:
          TELEGRAM_BOT_TOKEN: ${{ secrets.TELEGRAM_BOT_TOKEN }}
          TELEGRAM_CHAT_ID: ${{ secrets.TELEGRAM_CHAT_ID }}
